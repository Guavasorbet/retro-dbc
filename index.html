<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIGUEL // TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060a;
    --green:#39ff6a;
    --green-dim:#12a83d;
    --green-glow:rgba(57,255,106,0.65);
    --amber:#ffb000;
    --scanline:rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    overflow-x:hidden;
    font-family:'Share Tech Mono', monospace;
  }

  /* CRT screen wrapper */
  .crt{
    position:relative;
    min-height:100vh;
    width:100%;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center;
    padding:6vh 5vw 8vh;
    filter:contrast(1.05) brightness(1.02);
  }
  .crt::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      var(--scanline) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:multiply;
    opacity:0.35;
  }
  .crt::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .flicker{
    animation: flicker 6.5s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1;}
    92%{opacity:1;}
    93%{opacity:0.82;}
    94%{opacity:1;}
    95%{opacity:0.9;}
    96%{opacity:1;}
  }

  /* BLACK SCREEN + CYBERSPACE DIVE BOOT OVERLAY */
  #intro{
    position:fixed; inset:0; z-index:100;
    background:#000;
  }
  #introCanvas{
    width:100%; height:100%; display:block;
  }
  #bootText{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family:'VT323', monospace;
    color:var(--green);
    font-size:clamp(16px,4.2vw,26px);
    text-shadow:0 0 8px var(--green-glow);
    text-align:left;
    white-space:pre;
    opacity:0;
    z-index:2;
    transition:opacity 0.25s ease;
  }
  #intro.fade-out{
    animation: introFade 0.5s ease forwards;
  }
  @keyframes introFade{
    to{ opacity:0; visibility:hidden; }
  }

  /* CONTENT */
  #content{ opacity:0; width:100%; max-width:480px; }
  #content.show{ opacity:1; transition:opacity 0.5s ease; }

  .prompt-line{
    color:var(--green-dim);
    font-size:13px;
    letter-spacing:0.5px;
    margin-bottom:4px;
  }
  .prompt-line .cursor-blink{
    display:inline-block;
    background:var(--green);
    width:8px; height:14px;
    margin-left:4px;
    animation:blink 1s steps(1) infinite;
    vertical-align:middle;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  h1.name{
    font-family:'VT323', monospace;
    color:var(--green);
    font-size:clamp(38px,11vw,58px);
    line-height:0.95;
    margin:6px 0 2px;
    text-shadow:0 0 6px var(--green-glow), 0 0 18px var(--green-glow);
    letter-spacing:1px;
  }
  .role{
    color:var(--amber);
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:22px;
    text-shadow:0 0 6px rgba(255,176,0,0.5);
  }

  .frame{
    border:1px solid var(--green-dim);
    box-shadow:0 0 10px rgba(57,255,106,0.25), inset 0 0 20px rgba(57,255,106,0.06);
    padding:10px;
    margin-bottom:26px;
    background:rgba(18,168,61,0.03);
  }
  .frame img, .frame video{
    display:block;
    width:100%;
    filter:saturate(1.1) contrast(1.1);
  }
  .frame-label{
    font-size:11px;
    color:var(--green-dim);
    letter-spacing:2px;
    margin-top:8px;
    display:flex; justify-content:space-between;
  }

  .links{
    display:flex; flex-direction:column; gap:12px;
    margin-bottom:28px;
  }
  .link-row{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    border:1px solid var(--green-dim);
    color:var(--green);
    text-decoration:none;
    font-size:15px;
    letter-spacing:1px;
    background:linear-gradient(180deg, rgba(57,255,106,0.05), rgba(57,255,106,0));
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .link-row:active{
    transform:scale(0.98);
    background:rgba(57,255,106,0.15);
    box-shadow:0 0 14px var(--green-glow);
  }
  .link-row .idx{ color:var(--green-dim); font-size:12px; width:20px; }
  .link-row .arrow{ margin-left:auto; opacity:0.6; }

  .footer{
    font-size:11px;
    color:var(--green-dim);
    text-align:center;
    letter-spacing:1px;
    line-height:1.7;
  }

  @media (prefers-reduced-motion: reduce){
    .flicker{ animation:none; }
    #intro{ display:none; }
    #content{ opacity:1; }
  }
</style>
</head>
<body>

<div id="intro">
  <canvas id="introCanvas"></canvas>
  <div id="bootText"></div>
</div>

<div class="crt flicker">
  <div id="content">
    <div class="prompt-line">&gt; CONNECTION ESTABLISHED<span class="cursor-blink"></span></div>
    <h1 class="name">MIGUEL MORALES</h1>
    <div class="role">Connection Is The Protocol</div>

    <div class="frame">
      <video
        src="profile.mp4"
        poster="poster.jpg"
        autoplay loop muted playsinline preload="auto">
      </video>
    </div>

    <div class="links">
      <a class="link-row" href="https://www.linkedin.com/in/miguelmoralesr2d2" target="_blank" rel="noopener">
        <span class="idx">01</span> LinkedIn <span class="arrow">→</span>
      </a>
      <a class="link-row" href="https://github.com/Guavasorbet" target="_blank" rel="noopener">
        <span class="idx">02</span> GitHub <span class="arrow">→</span>
      </a>
      <a class="link-row" href="mailto:miguelmorales152@gmail.com">
        <span class="idx">03</span> Email <span class="arrow">→</span>
      </a>
    </div>
  </div>
</div>

<script>
// ---- Black screen boot text, then cyberspace tunnel dive ----
const canvas = document.getElementById('introCanvas');
const ctx = canvas.getContext('2d');
const introLayer = document.getElementById('intro');
const bootText = document.getElementById('bootText');
const content = document.getElementById('content');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Phase 1: typed boot lines on a black screen
const bootLines = [
  "BOOT SEQUENCE INITIATED...",
  "LOADING PROFILE...",
  "AUTHENTICATING CONTACT...",
  "ACCESS GRANTED."
];

setTimeout(() => { bootText.style.opacity = 1; }, 250);
let lineIndex = 0;
const lineTimer = setInterval(() => {
  if (lineIndex < bootLines.length){
    bootText.textContent = bootLines.slice(0, lineIndex + 1).join("\n");
    lineIndex++;
  } else {
    clearInterval(lineTimer);
  }
}, 340);

// Phase 2: quick cyberspace dive (accelerating tunnel of rings + vanishing-point lines)
const DIVE_START = 1650;   // when the dive begins, ms from page load
const DIVE_DURATION = 950; // how long the dive animation runs
const NUM_RINGS = 14;
const NUM_SPOKES = 20;

function easeInCubic(t){ return t * t * t; }

let diveRAF;
function drawDive(now, startTime){
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const maxDim = Math.sqrt(cx * cx + cy * cy) * 1.15;
  const elapsed = now - startTime;
  const t = Math.min(elapsed / DIVE_DURATION, 1);

  // trailing fade instead of hard clear, leaves light motion streaks
  ctx.fillStyle = 'rgba(4,6,10,0.5)';
  ctx.fillRect(0, 0, w, h);

  // fixed vanishing-point spokes, brightening as the dive progresses
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = `rgba(57,255,106,${0.08 + 0.18 * t})`;
  ctx.lineWidth = 1;
  for (let i = 0; i < NUM_SPOKES; i++){
    const angle = (i / NUM_SPOKES) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * 8, Math.sin(angle) * 8);
    ctx.lineTo(Math.cos(angle) * maxDim, Math.sin(angle) * maxDim);
    ctx.stroke();
  }
  ctx.restore();

  // expanding rings, staggered spawn, accelerating outward (warp-speed feel)
  for (let i = 0; i < NUM_RINGS; i++){
    const spawnFrac = i / NUM_RINGS;
    const spawnAt = spawnFrac * DIVE_DURATION * 0.55;
    if (elapsed < spawnAt) continue;
    const ringElapsed = elapsed - spawnAt;
    const ringT = Math.min(ringElapsed / (DIVE_DURATION * 0.6), 1);
    const eased = easeInCubic(ringT);
    const radius = eased * maxDim;
    const opacity = Math.max(0, 1 - ringT * 0.9);
    if (opacity <= 0) continue;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = `rgba(57,255,106,${opacity})`;
    ctx.shadowColor = 'rgba(57,255,106,0.9)';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    const size = radius * 0.62; // squarish ring, matches terminal-grid aesthetic
    ctx.strokeRect(-size, -size * 0.62, size * 2, size * 1.24);
    ctx.restore();
  }

  if (t < 1){
    diveRAF = requestAnimationFrame((n) => drawDive(n, startTime));
  }
}

setTimeout(() => {
  // clear boot text, drop into the dive
  bootText.style.opacity = 0;
  requestAnimationFrame((n) => drawDive(n, n));
}, DIVE_START);

setTimeout(() => {
  cancelAnimationFrame(diveRAF);
  introLayer.classList.add('fade-out');
  content.classList.add('show');
}, DIVE_START + DIVE_DURATION + 120);
</script>

</body>
</html>
